name: checks
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests and retain disposable project evidence
        shell: bash
        env:
          CI_EVIDENCE_DIR: ${{ runner.temp }}/agent-engineering-checks
          PROFILE_TEST_ARTIFACT_DIR: ${{ runner.temp }}/agent-engineering-checks/profile
          RUN_TEST_ARTIFACT_DIR: ${{ runner.temp }}/agent-engineering-checks/run
          AGENT_TEST_ARTIFACT_DIR: ${{ runner.temp }}/agent-engineering-checks/agent
        run: |
          mkdir -p "$CI_EVIDENCE_DIR"
          python --version 2>&1 | tee "$CI_EVIDENCE_DIR/toolchain.log"
          python -m unittest discover -s tests -v 2>&1 | tee "$CI_EVIDENCE_DIR/unittest.log"
      - name: Preserve test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-checks-python-${{ matrix.python }}
          path: ${{ runner.temp }}/agent-engineering-checks
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
